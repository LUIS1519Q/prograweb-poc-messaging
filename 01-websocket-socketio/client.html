<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PoC Socket.io</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; background: #f0f4f8; }
    h2 { color: #1a365d; }
    ul { list-style: none; padding: 0; }
    li { background: white; margin: 0.5rem 0; padding: 0.75rem 1rem; border-left: 4px solid #2b6cb0; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>PoC 01 — Socket.io: Mensajes en tiempo real</h2>
  <p>Mensajes recibidos del servidor (sin recargar la página):</p>
  <ul id="lista"></ul>

  <script>
    const socket = io('http://localhost:3000');

    socket.on('connect', () => {
      console.log('Conectado al servidor Socket.io');
    });

    socket.on('hello', (data) => {
      const li = document.createElement('li');
      li.textContent = `${data.hora} — ${data.mensaje}`;
      document.getElementById('lista').prepend(li);
    });
  </script>
</body>
</html>
